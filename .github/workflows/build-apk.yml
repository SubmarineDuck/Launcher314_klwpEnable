name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you start a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools   # the default also asks for a 'tools' package that no longer exists

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build the release APK (signed with the debug key, so it installs)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher314-klwp
          path: app/build/outputs/apk/release/*.apk
